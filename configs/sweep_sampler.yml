# Thesis ablation: sampling strategy.
# 8 strategies × 7 seeds = 56 runs (as in the thesis sampler table).
# The thesis uses the GCN backbone at 700 genes; baseline config_final
# already sets these.
name: ablation_sampler
fixed_overrides:
  model: { name: gcn_tf }
grid:
  sampler_strategy:
    - random
    - weighted
    - weighted
    - weighted
    - weighted
    - weighted
    - weighted
    - weighted
  project.seed: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
# NB: sampling-specific knobs (gamma / alpha) are handled inline; the
# grid above keeps 8 strategy "slots" so that each row in the sampler
# table corresponds to one slot. For the gamma/alpha variants overridden
# per-slot, prefer the explicit `experiments:` form below if you need
# exact reproducibility.
experiments:
- name: random
  overrides: { sampler_strategy: random }
- name: alpha_1
  overrides: { sampler_strategy: weighted, sampler_mode: alpha, sampler_alpha: 1 }
- name: alpha_2
  overrides: { sampler_strategy: weighted, sampler_mode: alpha, sampler_alpha: 2 }
- name: alpha_3
  overrides: { sampler_strategy: weighted, sampler_mode: alpha, sampler_alpha: 3 }
- name: gamma_090
  overrides: { sampler_strategy: weighted, sampler_mode: nulite, sampler_gamma: 0.90 }
- name: gamma_095
  overrides: { sampler_strategy: weighted, sampler_mode: nulite, sampler_gamma: 0.95 }
- name: gamma_098
  overrides: { sampler_strategy: weighted, sampler_mode: nulite, sampler_gamma: 0.98 }
- name: gamma_099
  overrides: { sampler_strategy: weighted, sampler_mode: nulite, sampler_gamma: 0.99 }
# Each of the 8 strategies above must be repeated across the 7 seeds
# {2020..2026} to obtain the 56-run table — wrap this YAML in your own
# driver loop, or duplicate the entries manually.
