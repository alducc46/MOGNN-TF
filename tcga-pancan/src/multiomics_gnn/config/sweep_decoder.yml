experiments:
- name: decoder_F_2020
  overrides:
    data:
      batch_size: 32
      feature_selection_method: variance
      gene_gene: true
      mirna_gene: true
      mirna_mirna: true
      num_gene: 700
      num_mirna: 100
      num_tf: 0
      num_workers: 1
      omic_mode: 4
      tf_gene: false
      tf_mirna: false
      tf_tf: false
    early_stopping:
      enabled: true
      metric: f1
      patience: 10
      strategy: maximize
    model:
      dropout: 0.2
      jk_mode: cat
      jumping_knowledge: true
      name: gat_tf
      parallel: true
      poolrate: 0.8
      poolsize: 8
    optimizer:
      name: adamw
    sampler_alpha: 2
    sampler_gamma: 0.98
    sampler_mode: alpha
    sampler_strategy: weighted
    scheduler:
      name: cosine
    train:
      ce_weighted: false
      decoder: false
      l2: false
      l2_reg_factor: 0.0005
      learning_rate: 0.0005
      num_epochs: 50
      shuffle: true
      validation_split: 0.2
      weight_decay: 3.0e-05
    project:
      seed: 2020
