name: tcga-pancan-env
channels:
  - pytorch
  - defaults
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.21.5
  - pandas=1.3.5
  - scikit-learn=0.24.2
  - scipy=1.6.2
  - matplotlib=3.4.3
  - seaborn=0.11.2
  - networkx=2.6.3
  - fastparquet=0.8.1
  - pyarrow=6.0.1
  - psutil=5.8.0
  - pip=21.2.4
  - wandb=0.12.10
  - pip:
      - torch==2.1.1+cu118
      - torchvision==0.16.1+cu118
      - torchaudio==2.1.1+cu118
      - torch_geometric==2.4.0
      - pytorch-lightning==2.1.1
      - pyfim==0.3.7
      - python-dotenv==0.21.0
      - pynvml==11.4.1
      - mlflow==2.3.2
      - snfpy==0.3.0
      - typing==3.10.0.0
